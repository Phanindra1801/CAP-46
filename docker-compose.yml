services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cap46-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
  mysql:
    image: mysql:8.4
    container_name: cap46-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: cap46-nginx
    ports:  
      - "80:80"
    volumes:
    - ./nginx/active/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ./nginx/candidates:/etc/nginx/candidates:ro
    - ./nginx/backups:/etc/nginx/backups:ro
    - ./nginx/validation:/etc/nginx/validation:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data: